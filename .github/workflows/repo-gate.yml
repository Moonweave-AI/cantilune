name: repo-gate

# Deliberately unfiltered. The per-package workflows use path filters, which
# left six packages outside CI entirely and let one drift below its coverage
# threshold unnoticed. This job runs the whole gate on every change.
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Encoding, lint, format and typecheck across every package.
      - run: pnpm test:static
      # Runs the same suites as `pnpm test` and additionally enforces each
      # package's coverage thresholds.
      - run: pnpm test:coverage
