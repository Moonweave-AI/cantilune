name: core

on:
  push:
    paths:
      - "src/packages/core/**"
      - "src/packages/runtime/**"
      - "src/packages/test-fixtures/**"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "src/packages/core/**"
      - "src/packages/runtime/**"
      - "src/packages/test-fixtures/**"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cantilune/core build
      - run: pnpm --filter @cantilune/test-fixtures build
      - run: pnpm --filter @cantilune/runtime build
      - run: pnpm --filter @cantilune/core typecheck
      - run: pnpm --filter @cantilune/core test
      - run: pnpm --filter @cantilune/core build
      - run: pnpm --filter @cantilune/core test:coverage
