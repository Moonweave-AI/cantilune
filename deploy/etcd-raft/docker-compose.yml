# Official etcd v3.5.21 3-node Raft (ADR-0029).
# Clustering: https://etcd.io/docs/v3.5/op-guide/clustering/
# Image: https://github.com/etcd-io/etcd/releases/tag/v3.5.21
name: cantilune-etcd-raft

services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.21
    pull_policy: never
    container_name: cantilune-etcd-1
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=cantilune-etcd
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - etcd1:/var/lib/etcd

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.21
    pull_policy: never
    container_name: cantilune-etcd-2
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:22379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=cantilune-etcd
      - --initial-cluster-state=new
    ports:
      - "22379:2379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - etcd2:/var/lib/etcd

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.21
    pull_policy: never
    container_name: cantilune-etcd-3
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:32379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-token=cantilune-etcd
      - --initial-cluster-state=new
    ports:
      - "32379:2379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - etcd3:/var/lib/etcd

volumes:
  etcd1:
  etcd2:
  etcd3:
