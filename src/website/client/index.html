<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cantilune · Harness</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%237C6FF2'/%3E%3Ccircle cx='21' cy='16' r='10' fill='%23151517'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("cln-theme") || "dark";
          var resolved =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          document.documentElement.dataset.clnTheme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.clnTheme = "dark";
        }
      })();
    </script>
    <script>
      (function () {
        var key = "cln-harness-v1";
        var side = "cln-harness-v1:conversations";
        function skipWs(s, i) {
          while (i < s.length && s.charCodeAt(i) <= 32) i += 1;
          return i;
        }
        function skipString(s, i) {
          i += 1;
          while (i < s.length) {
            var c = s.charCodeAt(i);
            if (c === 92) {
              i += 2;
              continue;
            }
            if (c === 34) return i + 1;
            i += 1;
          }
          return i;
        }
        function skipValue(s, i) {
          i = skipWs(s, i);
          var c = s.charCodeAt(i);
          if (c === 34) return skipString(s, i);
          if (c === 123 || c === 91) {
            var open = c;
            var close = c === 123 ? 125 : 93;
            var depth = 1;
            i += 1;
            while (i < s.length && depth > 0) {
              var d = s.charCodeAt(i);
              if (d === 34) {
                i = skipString(s, i);
                continue;
              }
              if (d === open) depth += 1;
              else if (d === close) depth -= 1;
              i += 1;
            }
            return i;
          }
          while (i < s.length) {
            var e = s.charCodeAt(i);
            if (e === 44 || e === 125 || e === 93 || e <= 32) break;
            i += 1;
          }
          return i;
        }
        function findTopLevel(s, name) {
          var i = skipWs(s, 0);
          if (s.charCodeAt(i) !== 123) return null;
          i += 1;
          var want = '"' + name + '"';
          while (i < s.length) {
            i = skipWs(s, i);
            if (s.charCodeAt(i) === 125) return null;
            if (s.charCodeAt(i) !== 34) return null;
            var keyStart = i;
            i = skipString(s, i);
            var keyText = s.slice(keyStart, i);
            i = skipWs(s, i);
            if (s.charCodeAt(i) !== 58) return null;
            i += 1;
            i = skipWs(s, i);
            var vs = i;
            var ve = skipValue(s, i);
            if (keyText === want) return { vs: vs, ve: ve };
            i = skipWs(s, ve);
            if (s.charCodeAt(i) === 44) i += 1;
          }
          return null;
        }
        try {
          var raw = localStorage.getItem(key);
          if (!raw || raw.length < 4096) return;
          var found = findTopLevel(raw, "conversations");
          if (!found) return;
          var blob = raw.slice(found.vs, found.ve);
          if (blob.length < 8) return;
          try {
            localStorage.setItem(side, blob);
          } catch (quota) {
            /* keep going — dropping the transcript unfreezes the tab */
          }
          localStorage.setItem(key, raw.slice(0, found.vs) + "{}" + raw.slice(found.ve));
        } catch (error) {
          /* keep keys */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
